services:
  postgres:
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
  migrate:
    environment:
      XIANYU_ENVIRONMENT: production
      XIANYU_RELEASE: ${XIANYU_RELEASE:?XIANYU_RELEASE is required}
      XIANYU_PUBLIC_BASE_URL: ${XIANYU_PUBLIC_BASE_URL:?XIANYU_PUBLIC_BASE_URL is required}
      XIANYU_DATABASE_URL: ${XIANYU_DATABASE_URL:?XIANYU_DATABASE_URL is required}
      XIANYU_REDIS_URL: ${XIANYU_REDIS_URL:-redis://redis:6379/0}
      XIANYU_WORKFLOW_QUEUE_BACKEND: rq
  api:
    environment:
      XIANYU_ENVIRONMENT: production
      XIANYU_RELEASE: ${XIANYU_RELEASE:?XIANYU_RELEASE is required}
      XIANYU_PUBLIC_BASE_URL: ${XIANYU_PUBLIC_BASE_URL:?XIANYU_PUBLIC_BASE_URL is required}
      XIANYU_DATABASE_URL: ${XIANYU_DATABASE_URL:?XIANYU_DATABASE_URL is required}
      XIANYU_REDIS_URL: ${XIANYU_REDIS_URL:-redis://redis:6379/0}
      XIANYU_WORKFLOW_QUEUE_BACKEND: rq
      XIANYU_READINESS_REQUIRE_WORKER: "true"
      XIANYU_MODEL_BACKEND: ${XIANYU_MODEL_BACKEND:-auto}
      XIANYU_MODEL_BASE_URL: ${XIANYU_MODEL_BASE_URL:-}
      XIANYU_MODEL_API_KEY: ${XIANYU_MODEL_API_KEY:-}
      XIANYU_MODEL_NAME: ${XIANYU_MODEL_NAME:-}
  worker:
    environment:
      XIANYU_ENVIRONMENT: production
      XIANYU_RELEASE: ${XIANYU_RELEASE:?XIANYU_RELEASE is required}
      XIANYU_PUBLIC_BASE_URL: ${XIANYU_PUBLIC_BASE_URL:?XIANYU_PUBLIC_BASE_URL is required}
      XIANYU_DATABASE_URL: ${XIANYU_DATABASE_URL:?XIANYU_DATABASE_URL is required}
      XIANYU_REDIS_URL: ${XIANYU_REDIS_URL:-redis://redis:6379/0}
      XIANYU_WORKFLOW_QUEUE_BACKEND: rq
      XIANYU_MODEL_BACKEND: ${XIANYU_MODEL_BACKEND:-auto}
      XIANYU_MODEL_BASE_URL: ${XIANYU_MODEL_BASE_URL:-}
      XIANYU_MODEL_API_KEY: ${XIANYU_MODEL_API_KEY:-}
      XIANYU_MODEL_NAME: ${XIANYU_MODEL_NAME:-}
  proxy:
    environment:
      XIANYU_DOMAIN: ${XIANYU_DOMAIN:?XIANYU_DOMAIN is required}
