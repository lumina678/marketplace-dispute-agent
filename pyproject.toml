[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "xianyu-dispute-agent"
version = "0.1.0"
description = "Multi-agent investigation and adjudication support for second-hand marketplace disputes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "mcp>=1.9,<2",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "psycopg[binary]>=3.2,<4",
  "pwdlib[argon2]>=0.2,<1",
  "redis>=5.2,<7",
  "rq>=2.1,<3",
  "sqlalchemy>=2.0.36,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "fakeredis>=2.25,<3",
  "httpx>=0.28,<1",
  "jsonschema[format]>=4.22,<5",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
]

[project.scripts]
xianyu-seed = "dispute_agent.seed:main"
xianyu-mcp = "dispute_agent.mcp_server:main"
xianyu-worker = "dispute_agent.worker:main"
xianyu-healthcheck = "dispute_agent.healthcheck:main"
xianyu-create-reviewer = "dispute_agent.reviewer_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
