name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  python-tests:
    name: Python compile and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Compile Python
        run: python -m compileall -q src scripts tests alembic
      - name: Validate repository contracts
        run: python scripts/validate_foundation.py
      - name: Run full test suite
        run: pytest --junitxml=artifacts/pytest.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: artifacts/pytest.xml
          if-no-files-found: error

  async-workflow-tests:
    name: Async workflow regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - name: Run queue, retry, pause, cancel and recovery tests
        run: pytest tests/test_async_workflow.py tests/test_deployment_foundation.py

  migrations:
    name: PostgreSQL migration round trip
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: xianyu_ci
          POSTGRES_USER: xianyu_ci
          POSTGRES_PASSWORD: xianyu_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xianyu_ci -d xianyu_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      XIANYU_ENVIRONMENT: test
      XIANYU_DATABASE_URL: postgresql+psycopg://xianyu_ci:xianyu_ci_only@127.0.0.1:5432/xianyu_ci
      XIANYU_TEST_POSTGRES_URL: postgresql+psycopg://xianyu_ci:xianyu_ci_only@127.0.0.1:5432/xianyu_ci
      XIANYU_AUTH_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - name: Upgrade, integration test, downgrade and re-upgrade
        run: |
          alembic upgrade head
          pytest tests/test_postgresql_integration.py
          alembic downgrade base
          alembic upgrade head
          alembic check

  frontend:
    name: Frontend JavaScript syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python scripts/check_frontend.py

  dependency-audit:
    name: Python dependency vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project and scanner
        run: |
          python -m pip install --upgrade 'pip>=26.1.2'
          python -m pip install . pip-audit
      - name: Audit installed dependencies
        run: python -m pip_audit --local --progress-spinner=off

  docker-build:
    name: Build API and Worker images
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [python-tests, async-workflow-tests, migrations, frontend, dependency-audit]
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build --file deploy/docker/api.Dockerfile --tag xianyu-api:ci .
      - name: Build Worker image
        run: docker build --file deploy/docker/worker.Dockerfile --tag xianyu-worker:ci .
      - name: Verify non-root runtime
        run: |
          test "$(docker run --rm --entrypoint id xianyu-api:ci -u)" = "10001"
          test "$(docker run --rm --entrypoint id xianyu-worker:ci -u)" = "10001"
